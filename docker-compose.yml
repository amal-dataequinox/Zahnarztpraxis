services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: palatty
      POSTGRES_PASSWORD: palatty
      POSTGRES_DB: palatty
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U palatty -d palatty']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
